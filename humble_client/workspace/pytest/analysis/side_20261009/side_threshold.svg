<text x="60" y="52" font-size="26" fill="#0b0b0b" text-anchor="start" font-weight="bold">How the robot picks its pass side - and why the threshold should be 0.20 m</text>
<text x="60" y="82" font-size="15" fill="#52514e" text-anchor="start" font-weight="normal">Head-on hallway runs, TurtleBot 4, rec15 + noghost critic, 9 Oct 2026 (and the 5 Oct goal-side run)</text>
<text x="60" y="130" font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="bold">1  The rule (top view)</text>
