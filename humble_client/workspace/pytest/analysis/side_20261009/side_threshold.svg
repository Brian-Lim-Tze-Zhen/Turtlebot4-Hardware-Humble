<text x="560" y="404" font-size="15" fill="#2a78d6" text-anchor="start" font-weight="bold">robot keeps RIGHT  -  passes on your left (German keep-right)</text>
<circle cx="1000" cy="375.0" r="14" fill="#fcfcfb" stroke="#eb6834" stroke-width="4"/>
<text x="1024" y="381.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold">walker clearly on the robot's right</text>
<path d="M 184 300 C 500 300, 700 240, 940 230 S 1140 240, 1180 284" fill="none" stroke="#eb6834" stroke-width="3" stroke-dasharray="10 6"/>
<text x="700" y="216" font-size="15" fill="#eb6834" text-anchor="start" font-weight="bold">robot keeps LEFT - does not cut across you</text>
<text x="60" y="483.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="normal">The side is set by the FIRST position sample (~6.5 m away); the side hold keeps it unless you later read</text>
<text x="60" y="505.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="normal">more than 0.30 m on the other side. So the threshold decides on one early, noisy estimate.</text>
