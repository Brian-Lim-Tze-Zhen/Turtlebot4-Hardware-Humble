# PATH-SIDE COPY of social_nav2_headon_F_hwreq_block_approach_hw.yaml (8 Oct 2026): identical except side_ref_goal_topic "" (off):
# pass side measured against the start of the global path again (simulation behaviour). Sim test 8 Oct (bags headon_hwsync_corr / headon_sidegoal_corr vs headon_v4_corr / headon_noghost_corr): the robot-goal line reversed the first side in 3/10 runs, and once (critic RIGHT, planner LEFT) the pass was 0.319 m; path-based 0/10. Cost: a centred walker gets either side (the side the planner bends to).
# V4 PORT (7 Oct 2026): social_nav2_headon_F_hwreq_block_confirm_goalside_hw.yaml plus the
# simulation final configuration (social_nav2_headon_F_hwreq_block_blockedhold_approach_sim.yaml,
# SocialCritic v4, library ee5b22ce). Changes, all in FollowPath.SocialLaneCritic:
#   - lane_ignore_beyond_goal true, lane_beyond_goal_margin 0.5 (people beyond the goal get no
#     first-sight lane; was off on hardware)
#   - lane_approach_window_s 1.0, lane_approach_min_move 0.5, lane_approach_consistency 0.6
#     (sustained approach; new in v4)
# Needs the v4 build of social_critic_lane (branch v4-port-20261007). Kept from the hardware
# config: side_ref_goal_topic goal_pose, odom_reliable, Humble plugin names, timeouts.
# Collision monitor: the Humble bringup does not start it. Launch with
# launch/lab2_bringup_cm.launch.py, which adds it between the velocity smoother
# (cmd_vel_smoothed) and the robot (cmd_vel), as the Jazzy bringup does in simulation.
# BlockedHold: the Humble collision monitor (1.1.20) has no polygon_sub_topic, so the zone is
# a FIXED square here (the +/-1.6 m square the simulation node publishes) with enabled: false,
# and scripts/blocked_person_beep_node.py (hold:=true) switches BlockedHold.enabled at runtime.
# GOAL-SIDE VARIANT of social_nav2_headon_F_hwreq_block_confirm_hw.yaml: identical except
# side_ref_goal_topic "goal_pose" (new). side_switch_offset was 0.30 for one run
# (copy: .bak_20261005_side030) and is 0.10 again.
# LANE PORT (5 Oct 2026): social_nav2_ablation_F_socialzone_keepout.yaml plus the
# simulation head-on lane rules (social_nav2_headon_F_hwreq_block_sim.yaml):
#   - SocialCritic -> SocialLaneCritic (package social_critic_lane, the simulation critic built for Humble)
#   - critic parameters taken unchanged from the simulation config
#   - vx_min 0.0, keep-last-plan behaviour tree, lane_block source in the GLOBAL costmap
# Use with launch/perception_camray_lane_bringup.launch.py (body-disk person cloud, ray_coast on).
bt_navigator:
  ros__parameters:
    odom_topic: odom_reliable
    enable_stamped_cmd_vel: true
    global_frame: map
    robot_base_frame: base_link
    bt_loop_duration: 10
    default_server_timeout: 200   # V4 PORT: as simulation (20 -> 200 ms; at 20 the BT timed out on follow_path under load and aborted at start)
    wait_for_service_timeout: 5000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
    # Local copy of nav2's navigate_to_pose_w_replanning_and_recovery.xml
    # with the ComputePathToPose RateController raised 1.0 -> 5.0 Hz.
    # Applies to both full and ablation conditions, so the comparison
    # stays controlled — but it does invalidate trials recorded under
    # the stock BT.
    default_nav_to_pose_bt_xml: /root/thesis_social_navigation_ws/behavior_trees/navigate_to_pose_keep_last_plan.xml
    default_nav_through_poses_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml
    transform_tolerance: 0.3
controller_server:
  ros__parameters:
    odom_topic: odom_reliable
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # TONIGHT FIX: time_steps 56 -> 120.
      # Rollout reach = time_steps * model_dt * vx_max.
      # At the old 56 steps and the REAL achievable speed (0.26 m/s,
      # smoother-capped), reach was only ~0.73 m - obstacle geometry
      # beyond that could not influence trajectory selection at all.
      # 120 steps -> ~1.56 m reach. If controller_server logs
      # "Control loop missed its desired rate", drop to 100 or
      # reduce batch_size to 1500.
      # 2 Oct 2026: 200 -> 120. 10 s rollouts at wz_std 1.5 wasted most
      # samples on curling arcs (bag headon_real_F_20260925_140425: 41 wz
      # sign flips in 34 s). 120 steps -> ~1.9 m reach at 0.31 m/s.
      # 170 tried 2 Oct (bag headon_F_wz07_infl035_ts170): held 20 Hz but no
      # earlier turn-in, wz sign flips 9 -> 17, robot crawled at 0.04-0.18 m/s
      # inside the person lane, pass 0.28 m. Reverted to 120.
      time_steps: 120
      model_dt: 0.05
      batch_size: 1200 # 2000 tried 2 Oct (headon_F_wz07): loop ran ~10 Hz instead of 20; reverted
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.25
      vy_std: 0.2
      # TONIGHT FIX (restored lost tuning): wz_std 0.4 -> 0.9.
      # Wider angular sampling so rollouts actually explore lateral
      # swerves instead of mostly-straight candidates.
      # 2 Oct 2026: 1.5 -> 0.7. Main wobble source. Early detour is the
      # global path's job (person cloud is in the global costmap), not
      # random angular sampling.
      wz_std: 0.7
      # TONIGHT FIX (restored lost tuning): vx_max 0.5 -> 0.26.
      # Must match velocity_smoother max (0.26). At 0.5 MPPI planned
      # escape maneuvers at speeds the smoother silently clipped,
      # so executed trajectories were systematically ~2x slower than
      # planned - a direct cause of late/close avoidance.
      vx_max: 0.31
      # BASELINE: vx_min -0.35 -> -0.26.
      # Reverse is retained in MPPI's action space, capped to match
      # velocity_smoother's min_velocity[0] (-0.26). Measured reversals
      # peaked at -0.116 m/s, so the cap is never the binding limit.
      vx_min: 0.0   # LANE PORT: -0.31 -> 0.0, no reversing while avoiding (as in simulation)
      vy_max: 0.5
      # TONIGHT FIX (restored lost tuning): wz_max 1.9 -> 1.5.
      # Matches velocity_smoother angular cap.
      wz_max: 1.5 # was 1.9 - smoother caps at 1.5
      iteration_count: 1
      prune_distance: 2.8 # was 1.7 — let the followers see the bend (finding #1)
      transform_tolerance: 0.2   # HW (8 Oct 2026): 0.1 -> 0.2, Wi-Fi TF delay p95 ~150 ms aborted goals; simulation 0.1
      temperature: 0.30 # Was 0.30
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "ObstaclesCritic","SocialLaneCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        critical_weight: 20.0
        repulsion_weight: 3.0
        collision_cost: 100000.0
        consider_footprint: true      # 必须开启，否则按机器人中心点算，不是表面
        critical_cost: 300.0
      SocialLaneCritic:
        # HEAD-ON AVOID: read the KF output, which carries velocity.
        # /person_positions_fused has vx = vy = 0, so the time-aware
        # propagation below treated a 1.2 m/s walker as standing still and
        # the critic only acted once the person was already within reach.
        topic: /predicted_person_positions
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        # HEAD-ON AVOID: 1.10 -> 1.00. In the 2.5 m corridor the robot centre can be
        # at most ~1.0 m from a centreline walker, so 1.10 could never be satisfied
        # and left a cost on every pass, which made retreating look cheaper.
        # 1.00 -> 0.92 and margin 0.85 -> 0.82: at 1.00 the robot pressed itself to
        # ~0.09 m from the wall surface and could not move forward there until the
        # walker had gone (4 s wait in headon_avoid_v16_trial3).
        # 0.92 -> 0.86 once the walker is held on its lane (lane_lateral_trust 0):
        # the usable strip in this corridor is only |y| 0.80 .. 0.91 (0.8 m target
        # on one side; ~0.15 m off the wall surface on the other, closer than that
        # MPPI found no collision-free rollout and spun: headon_avoid_v19_trial2).
        social_distance: 0.86
        group_aware: true
        narrow_social_distance: 0.60
        group_topic: "/social_groups"
        critical_distance: 0.35
        collision_cost: 800.0
        use_prediction: true
        prediction_weight: 0.5
        trajectory_point_step: 4
        track_timeout: 0.5
        max_coast_time: 6.0
        coast_weight: 1.0
        min_coast_speed: 0.15
        max_coast_speed: 2.5
        time_aware: true          # 新增
        max_prediction_time: 6.0  # HEAD-ON AVOID: 3.0 -> 6.0, the full 120 x 0.05 s rollout
        # HEAD-ON AVOID: keep-right pass side (see social_critic.hpp). Rollout
        # points within 2 m of an approaching walker must be at least 0.9 m
        # to the walker's left (the robot's right), matching the keep-right
        # strip in the person cloud, so plan and controller agree on the side.
        pass_side_weight: 12.0   # was 8.0: at ~7 m detection the robot has to commit faster
        #pass_side_weight: 8.0    # gentler veer than the 15.0 of headon_avoid_v13 (which over-steered to the wall, then pivoted ~1-2 s)
        pass_side_margin: 0.80
        # Far edge of the target strip: stay within 0.80 .. 0.90 m right of the lane
        # (beyond ~0.91 the robot is too close to the wall to keep moving).
        pass_side_max_offset: 0.90
        # RViz markers on /social_critic/lane_markers: frozen lane (blue), target
        # strip (green), predicted walker positions (red), social distance (orange).
        publish_markers: true
        # Keep-side block for the GLOBAL planner (see social_critic.hpp): the plan
        # takes the same side as the controller from first sight.
        publish_lane_block: true
        # 1.5 -> 0.4: 1.5 sealed the 2.5 m corridor but piles up with several
        # walkers. 0.4 steered NavFn as well (0-4 of ~30 plans on the wrong side,
        # as at 0.8 and 1.5); centred-walker clearance was a few cm lower
        # (0.757-0.843 m over 4 runs).
        lane_block_width: 0.4
        # Several walkers: handle the nearest one first (see social_critic.hpp).
        lane_nearest_only: true
        # A reused track id on a different person gets a fresh lane.
        lane_jump_reset: 1.5
        # Slow to 0.10 m/s while a walker goes by and for 1 s after: someone
        # may be hidden behind it (see social_critic.hpp).
        occlusion_slow_weight: 300.0
        occlusion_slow_speed: 0.15   # 0.10 dipped under the stopped threshold for 0.3 s in one run
        occlusion_slow_gap: 1.0
        occlusion_slow_after_s: 1.0
        lane_block_overlap: 0.30
        lane_block_robot_gap: 1.0
        lane_lateral_trust: 0.0
        pass_side_range: 12.0    # ahead of the walker along its lane: the whole approach
        pass_side_min_closing: 0.3
        # Hardware-range tuning: freeze the lane as soon as a person appears ahead,
        # ~1 s before the KF confirms the approach (see social_critic.hpp).
        lane_on_first_sight_s: 1.5
        # WATCH FIRST (hardware, 5 Oct 2026): a new person ahead gets no lane at
        # once; the lane is frozen only if the person has come at least
        # lane_first_sight_min_move (0.25 m) closer within this time. Without it
        # the robot swerved for a person standing 7 m away
        # (bags standing_lanepilot_run01_20261005_092818,
        # headon_lanepilot_run03_20261005_094105). Value as in the simulation
        # config social_nav2_headon_F_hwreq_block_blockedhold_sim.yaml.
        lane_first_sight_confirm_s: 0.5
        lane_first_sight_min_move: 0.25
        lane_ignore_beyond_goal: true
        lane_beyond_goal_margin: 0.5
        # SUSTAINED APPROACH (7 Oct 2026, simulation v4): a lane only for a person who has come at
        # least 0.5 m closer within 1.0 s, with at least 60 % of the steps towards the robot. One
        # velocity sample above pass_side_min_closing no longer starts a lane: the position of a
        # standing member can jump by 0.3-0.5 m in one step. On this robot the lane rule started
        # for a member of a standing pair in 4 of 8 pair runs on 5 Oct
        # (hardware_analysis/lane_events_5oct.txt). No group skip in this configuration.
        lane_approach_window_s: 1.0
        lane_approach_min_move: 0.5
        lane_approach_consistency: 0.6
        # Choose the side from where the walker is (see social_critic.hpp): keep
        # right by default, pass on the LEFT if the walker is > 0.2 m to the robot's
        # right, averaged over the first second. Baseline without it: walker 0.4 m
        # to the right -> 0.50 m pass (bag headon_hwreq_offset_base_y-0.4_trial1).
        pass_side_auto: true
        # 1.0 s / 0.2 m -> 0.6 s / 0.25 m, plus a commit: the side is locked as soon
        # as the robot is 6 cm off the lane. Over 9 centred runs the measured
        # offset was +0.11 +/- 0.23 m, and one read -0.22 m at the end of the 1 s
        # window: the side flipped to LEFT with the robot already moving right and
        # it passed at 0.46 m (bag headon_hwreq_block_corr_trial2).
        side_decision_s: 0.6
        # Side: pass on the LEFT if the walker reads more than 0.10 m to the robot's
        # right, otherwise keep right. The estimate is only good to a few decimetres
        # (centred walker: -0.22..+0.50 m; walker at -0.40 m: -0.40, -0.19, -0.17),
        # so no threshold separates "centred" from "0.4 m right". What matters is
        # that the side is chosen EARLY and never changed: for a centred walker
        # either side gives the same clearance, and a wrong "right" for a walker
        # on the right ends in a squeeze or an abort (bags headon_hwreq_b2_y-0.4,
        # headon_hwreq_z3_y-0.4). A low threshold plus the 6 cm commit does that.
        # GOAL-SIDE VARIANT (hardware, 5 Oct 2026): 0.10 -> 0.30 and the offset is
        # measured against the robot-goal line (side_ref_goal_topic). Rule asked
        # for by Brian: walker straight ahead or to the robot's left -> pass on the
        # right; walker to the robot's right -> pass on the left.
        # 12:15: 0.30 -> back to 0.10 (the simulation value). At 0.30 a walker read
        # 0.26 m to the right got "keep right", towards the walker
        # (bag headon_lanegoalside_run01_20261005_100329).
        side_switch_offset: 0.10
        side_ref_goal_topic: ""   # PATH-SIDE (8 Oct 2026): off, see header
        side_ambiguous_offset: 0.0
        side_commit_offset: 0.06
        # A re-acquired walker (new track id) inherits the lane and side of the
        # track it replaces instead of getting a new lane frozen from the robot's
        # displaced position (see social_critic.hpp). Without it, a dropout test
        # froze a second lane and chose the WRONG side for the new id (bag
        # headon_hwreq_dropout_base_trial1: "track 100 ... robot keeps LEFT").
        lane_carry_radius: 0.6
        lane_carry_along: 2.0
        # No retreat from an approaching walker (see social_critic.hpp): step
        # aside instead of turning round to drive away.
        # 60 -> 300. At ~7 m detection the robot cannot reach social_distance by
        # driving forward, and at 60 it bought time by curling back-right until it
        # faced down the corridor, then had to turn ~180 deg back at the wall
        # (bag headon_hwreq_r2_trial1).
        no_retreat_weight: 300.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.25   # HW (8 Oct 2026): 0.5 -> 0.25 (= xy_goal_tolerance). With vx_min 0 the robot turned to the final yaw first at ~0.4 m and left the goal behind it (bag headon_v4front_run01_20261008_094928); simulation 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0 
        threshold_to_consider: 0.5
      # CostCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 12.0 # Increase slightly relative to PathAlign
      #   critical_cost: 300.0
      #   consider_footprint: true
      #   collision_cost: 1000000.0
      #   near_goal_distance: 1.0
      #   trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # TONIGHT FIX (restored lost tuning): 14.0 -> 8.0.
        # 14.0 pulled rollouts hard back onto the straight global
        # path that runs directly through the person's lane, fighting
        # the obstacle cost. 8.0 lets lateral deviation win when the
        # costmap says the corridor is occupied.
        cost_weight: 4.0 # Lowered (e.g. from 8.0/14.0) so costmap avoidance outweighs path sticking
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 6 #20 to 6
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0 # was 4.0. 9.0 tried 2 Oct (headon_F_wz07_pf9b): wobble returned, 37 wz sign flips vs 4-8 at 6.0; reverted
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 7  # <--- Change from 5 (gives 3.5m radius from center)
      # width: 3
      height: 7  # <--- Change from 5 (gives 3.5m radius from center)
      # height: 3
      resolution: 0.06
      footprint: "[[ 0.189,  0.000],
                  [ 0.134, -0.134],
                  [ 0.000, -0.189],
                  [-0.134, -0.134],
                  [-0.189,  0.000],
                  [-0.134,  0.134],
                  [ 0.000,  0.189],
                  [ 0.134,  0.134]]"
      plugins: ["static_layer", "obstacle_layer", "nonpersistent_voxel_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: true
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0

      nonpersistent_voxel_layer:
        plugin: "nav2_costmap_2d/NonPersistentVoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: -0.1
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: predicted_person_cloud
        predicted_person_cloud:
          sensor_frame: base_link   # range + raytrace origin = robot, not map (0,0); without this obstacle_max_range dropped every point beyond 9 m of map origin
          topic: /predicted_person_cloud
          max_obstacle_height: 2.0
          marking: true
          data_type: "PointCloud2"
          clearing: true
          obstacle_max_range: 4.0 # <--- Change from 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0 # <--- Change from 5.0
          raytrace_min_range: 0.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      # BASELINE: 1.0 Hz, unchanged from the TurtleBot4 template.
      # Nav2's default BT wraps ComputePathToPose in a RateController
      # at 1 Hz, so the planner replans at 1 Hz regardless — raising
      # this alone would not reduce plan lag. Both would need raising
      # together. At 0.2 m/s person speed the predicted lane is <=0.2 m
      # stale per cycle, small against the ellipse and inflation.
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[ 0.189,  0.000],
                  [ 0.134, -0.134],
                  [ 0.000, -0.189],
                  [-0.134, -0.134],
                  [-0.189,  0.000],
                  [-0.134,  0.134],
                  [ 0.000,  0.189],
                  [ 0.134,  0.134]]"
      resolution: 0.06
      track_unknown_space: true
      # TONIGHT FIX (architectural): predicted person cloud added to
      # the GLOBAL costmap. Head-on with the goal behind the person
      # cannot be solved by the local planner alone - the global
      # planner must route around the predicted lane from the start,
      # otherwise PathAlign/PathFollow keep dragging the robot back
      # onto a straight line through the person.
      #
      # THESIS ADDITION: social_group_layer added alongside
      # nonpersistent_voxel_layer, not replacing it - one handles
      # predicted human motion (per-person, dynamic), the other
      # handles social group zones (conversation o-space, static).
      # Complementary layers, same NonPersistentVoxelLayer plugin
      # type for both, different topics.
      plugins: ["static_layer", "obstacle_layer", "nonpersistent_voxel_layer", "inflation_layer"]
      # ABLATION F (ported from sim): zone enters as a KeepoutFilter mask,
      # applied above all layers so nothing overwrites it.
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
        transform_tolerance: 0.2   # HW (8 Oct 2026): 0.1 -> 0.2, Wi-Fi TF delay p95 ~150 ms aborted goals; simulation 0.1
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: true
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      nonpersistent_voxel_layer:
        plugin: "nav2_costmap_2d/NonPersistentVoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: predicted_person_cloud lane_block
        # The SocialLaneCritic's keep-side block. GLOBAL costmap only - never add it
        # to the local costmap (a lethal strip there traps the robot).
        lane_block:
          sensor_frame: base_link
          topic: /social_critic/lane_block
          max_obstacle_height: 2.0
          marking: true
          data_type: "PointCloud2"
          clearing: true
          obstacle_max_range: 9.0
          obstacle_min_range: 0.0
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
        predicted_person_cloud:
          sensor_frame: base_link   # range + raytrace origin = robot, not map (0,0); without this obstacle_max_range dropped every point beyond 9 m of map origin
          topic: /predicted_person_cloud
          max_obstacle_height: 2.0
          marking: true
          data_type: "PointCloud2"
          clearing: true
          obstacle_max_range: 9.0
          obstacle_min_range: 0.0
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      # THESIS ABLATION F: social zones as GRADED COST, not obstacles.
      #
      # Supersedes ablation E's social_group_layer, which fed
      # /social_group_cloud into a NonPersistentVoxelLayer. Every marked
      # cell there became LETHAL_OBSTACLE (254), so a conversation
      # o-space was not expensive, it was FORBIDDEN. In a corridor too
      # narrow to route around the pair that left no valid plan at all
      # and the robot halted - the worst outcome of the three.
      #
      # This layer reads a graded nav_msgs/OccupancyGrid from
      # social_zone_costmap_node.py instead. Cost ordering FLIPS with
      # corridor width, measured by that node's costmap clearance probe:
      #
      #   WIDE   corridor: o-space 90 (~229), flanks unpainted
      #                    -> going around is cheap, robot goes around
      #   NARROW corridor: o-space 35 (~89),  flanks 60 (~152)
      #                    -> the gap between them is the cheapest
      #                       finite route, robot passes through slowly
      #
      # Nothing published reaches the inscribed (253) or lethal (254)
      # band, so the zone is ALWAYS crossable and the planner is
      # choosing on cost rather than legality. The people themselves
      # stay lethal via the predicted_person_cloud in
      # nonpersistent_voxel_layer above - the robot may cross an
      # o-space, it still cannot drive into a person.
      #
      # trinary_costmap: false is the entire point of this layer. Left
      # at its default (true), every value above lethal_cost_threshold
      # collapses to 254 and this becomes ablation E again with extra
      # steps.
      #
      # use_maximum: true stops StaticLayer overwriting the obstacle and
      # predicted-person layers underneath it - without this the social
      # grid would erase real obstacles wherever it publishes zero.
      #
      # RESIZE HAZARD: the global costmap is NOT rolling, and StaticLayer
      # resizes the master grid to whatever map it receives. The node
      # therefore MIRRORS /map's resolution, width, height and origin
      # exactly, which makes that resize a no-op. If the node ever
      # publishes a grid of different geometry, it will shrink the whole
      # global costmap to the size of one conversation zone.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
      # Reset from 2.0/1.5 -> 0.5/1.0 for gentler decay, wider berth
        cost_scaling_factor: 2.0 # was 0.5 — steep decay; skimming becomes expensive, walls stay passable
        # 2 Oct 2026: 0.25 -> 0.55 (global only). At 0.25 the cost band was
        # ~0.06 m beyond the robot radius, so the path hugged the person
        # cloud and only bent close to it. EXPERIMENTAL - also pushes
        # paths off walls; check narrow-corridor scenarios still plan.
        inflation_radius: 0.35
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    #expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2   # HW (8 Oct 2026): 0.1 -> 0.2, Wi-Fi TF delay p95 ~150 ms aborted goals; simulation 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    enable_stamped_cmd_vel: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.31, 0.0, 1.5] # [0.26, 0.0, 1.0]
    min_velocity: [-0.31, 0.0, -1.5] # [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    # HUMBLE (7 Oct 2026): started by launch/lab2_bringup_cm.launch.py. Humble ignores
    # enable_stamped_cmd_vel and state_topic (Twist, no state topic).
    enable_stamped_cmd_vel: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    # BlockedHold first, as in simulation (social_nav2_headon_F_hwreq_block_blockedhold_approach_sim.yaml).
    polygons: ["BlockedHold", "FootprintApproach"]
    # Hold while blocked by a person. Simulation: blocked_person_beep_node_sim.py publishes this
    # square on /blocked_hold_polygon. HUMBLE: fixed square, switched by
    # scripts/blocked_person_beep_node.py through the parameter BlockedHold.enabled
    # (tested offline 7 Oct 2026: 0.30 m/s -> 0.00 when enabled, back to 0.30 when disabled).
    BlockedHold:
      type: "polygon"
      action_type: "stop"
      points: [1.6, 1.6, 1.6, -1.6, -1.6, -1.6, -1.6, 1.6]
      max_points: 3        # Humble name; = simulation min_points 4
      visualize: False
      enabled: False       # switched on only while blocked
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      # Humble has max_points (points allowed before the action) instead of Jazzy's
      # min_points (points needed for the action): max_points 5 = min_points 6.
      max_points: 5
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_max: 0.15

costmap_filter_info_server:
  ros__parameters:
    # type 0 = keepout. base 0.0 / multiplier 1.0 = mask value -> cost 1:1
    type: 0
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/social_zone_map"
    base: 0.0
    multiplier: 1.0
